<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>All Results</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        .card {
            display: flex;
            gap: 24px;
            align-items: center;
            flex-wrap: wrap;
        }
        .download-transcript {
            background-color: #3989c6;
            color: white;
            padding: 8px 15px;
            border: none;
            border-radius: 4px;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .download-transcript:hover {
            background-color: #2e7ab5;
        }
        .download-transcript.downloading {
            pointer-events: none;
            opacity: 0.85;
        }
        .download-transcript .loader {
            display: none;
            position: relative;
            width: 28px;
            height: 28px;
            background-repeat: no-repeat;
            background-image: linear-gradient(#FFF 50px, transparent 0),
                              linear-gradient(#FFF 50px, transparent 0),
                              linear-gradient(#FFF 50px, transparent 0),
                              linear-gradient(#FFF 50px, transparent 0),
                              linear-gradient(#FFF 50px, transparent 0),
                              linear-gradient(#FFF 50px, transparent 0);
            background-size: 3px 20px;
            background-position: 0px center, 5px center, 10px center, 15px center, 20px center, 25px center;
            animation: spikeUp 1s linear infinite alternate;
        }
        .download-transcript.downloading .loader {
            display: inline-block;
        }
        @keyframes spikeUp {
            0% { background-size: 3px 20px }
            16% { background-size: 3px 28px, 3px 20px, 3px 20px, 3px 20px, 3px 20px, 3px 20px }
            33% { background-size: 3px 20px, 3px 28px, 3px 20px, 3px 20px, 3px 20px, 3px 20px }
            50% { background-size: 3px 20px, 3px 20px, 3px 28px, 3px 20px, 3px 20px, 3px 20px }
            66% { background-size: 3px 20px, 3px 20px, 3px 20px, 3px 28px, 3px 20px, 3px 20px }
            83% { background-size: 3px 20px, 3px 20px, 3px 20px, 3px 20px, 3px 28px, 3px 20px }
            100% { background-size: 3px 20px, 3px 20px, 3px 20px, 3px 20px, 3px 20px, 3px 28px }
        }
    </style>
</head>

<body>

<!-- Sidebar -->
<div id="sidebar-container" data-active="students"></div>

<div class="content">

    <!-- Navbar -->
    <nav>
        <i class='bx bx-menu'></i>
        <form action="#">
            <div class="form-input">
                <input type="search" placeholder="Search...">
                <button class="search-btn" type="submit">
                    <i class='bx bx-search'></i>
                </button>
            </div>
        </form>
        <a href="#" class="profile">
                <img src="../../images/logo.png">
        </a>
    </nav>

    <main>

        <div class="header">
            <div class="left">
                <h1 id="page-title">Exam Results</h1>
                <ul class="breadcrumb">
                    <li><a href="students_finished.html">Finished Students</a></li>
                    /
                    <li><a href="#" class="active" id="student-name">Student</a></li>
                </ul>
            </div>
        </div>

        <div class="card">
            <p><strong>Name:</strong> <span id="student-name-card">-</span></p>
            <p><strong>Class:</strong> <span id="student-class">-</span></p>
            <button class="download-transcript" id="downloadTranscript" style="display:none;">
                <i class='bx bx-download'></i>
                <span class="download-label">Download Full Transcript</span>
                <span class="loader"></span>
            </button>
        </div>

        <div class="bottom-data">
                <div class="orders">
                    <div class="header">
                        <i class='bx bx-receipt'></i>
                        <h3>List Of Results</h3>
                        <i class='bx bx-filter'></i>
                        <i class='bx bx-search'></i>
                    </div>
                    <table>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Exam</th>
                                <th>Total Marks</th>
                                <th>Position</th>
                                <th>Stream Position</th>
                                <th>Date</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="results-body">
                            <tr>
                                <td colspan="7" style="text-align:center;">Loading...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
        </div>

    </main>
</div>

    <script src="../../js/index.js"></script>
    <script src="../../js/load-sidebar.js"></script>
    <script src="../../js/students/student_all_results.js"></script>
</body>
</html>
