<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subject Marks</title>
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.2/css/all.min.css">
    <link rel="stylesheet" href="../css/Tpanel.css">
    <link rel="stylesheet" href="../css/sticky-footer.css">
    <link rel="stylesheet" href="../css/subject.css">
    <link rel="stylesheet" href="../css/markspopup.css">   <link rel="stylesheet" href="../css/bottom-navigator.css"></head>
<body>

<div id="headerContainer"></div>
<div id="sidebarContainer"></div>
<div id="bottomNavContainer"></div>

<section class="marks-table">
    <a href="home.html" class="back-btn">← Back to Home</a>
    
    <h1 class="heading">Subject Marks Management</h1>

    <!-- Messages -->
    <div class="error-message" id="errorMessage"></div>
    <div class="success-message" id="successMessage"></div>

    <!-- Marks Out Of (for regular subjects) -->
    <div class="marks-out-of" id="regularMarksOutOfSection" style="display: none;">
        <label for="marksOutOf">Marks Out Of:</label>
        <input type="number" id="marksOutOf" min="1" max="100" placeholder="e.g., 100">
        <button type="button" id="setMarksBtn">Set</button>
    </div>

    <!-- Paper Marks Out Of (for English and Kiswahili) -->
    <div class="marks-out-of" id="paperMarksOutOfSection" style="display: none;">
        <div class="paper-marks-container">
            <div class="paper-input-group">
                <label for="paper1OutOf">Paper 1 Out Of:</label>
                <input type="number" id="paper1OutOf" min="1" max="100" placeholder="e.g., 50">
            </div>
            <div class="paper-input-group">
                <label for="paper2OutOf">Paper 2 Out Of:</label>
                <input type="number" id="paper2OutOf" min="1" max="100" placeholder="e.g., 50">
            </div>
            <button type="button" id="setPaperBtn" class="paper-set-btn">Set Both</button>
        </div>
    </div>

    <!-- Loading Indicator -->
    <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>Loading students...</p>
    </div>

    <!-- Students Table -->
    <div id="studentsContainer" style="display: none;">
        <table class="content-table" id="studentsTable">
            <thead>
                <tr>
                    <th>Student Name</th>
                    <th>Marks</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="studentTableBody">
                <!-- Populated by JavaScript -->
            </tbody>
        </table>
    </div>

    <!-- Edit Marks Modal -->
    <div class="modal fade" id="editMarksModal" tabindex="-1" aria-labelledby="editMarksLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editMarksLabel">Edit Student Marks</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="editMarksForm">
                    <div class="modal-body">
                        <input type="hidden" id="modalStudentId">
                        <input type="hidden" id="modalStudentClassId">
                        <div class="mb-3">
                            <label for="modalStudentName" class="form-label">Student Name</label>
                            <input type="text" class="form-control" id="modalStudentName" readonly>
                        </div>
                        
                        <!-- Regular subject input (single) -->
                        <div id="regularSubjectInputGroup" style="display: none;">
                            <div class="mb-3">
                                <label for="modalMarksInput" class="form-label">Marks (Out of <span id="modalMarksOutOf">100</span>)</label>
                                <input type="number" class="form-control" id="modalMarksInput" name="regularMarks" min="0">
                            </div>
                        </div>
                        
                        <!-- English dual inputs (Paper 1 + Paper 2) -->
                        <div id="englishInputGroup" style="display: none;">
                            <div class="mb-3">
                                <label for="paper1EnglishMarks" class="form-label">Paper 1 (Out of <span id="paper1EnglishOutOf">100</span>)</label>
                                <input type="number" class="form-control" id="paper1EnglishMarks" name="paper1English" min="0">
                            </div>
                            <div class="mb-3">
                                <label for="paper2EnglishMarks" class="form-label">Paper 2 (Out of <span id="paper2EnglishOutOf">100</span>)</label>
                                <input type="number" class="form-control" id="paper2EnglishMarks" name="paper2English" min="0">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Total Percentage: <span id="englishTotalPercentage">0%</span></label>
                            </div>
                        </div>
                        
                        <!-- Kiswahili dual inputs (Paper 1 + Paper 2) -->
                        <div id="kiswahiliInputGroup" style="display: none;">
                            <div class="mb-3">
                                <label for="paper1KiswahiliMarks" class="form-label">Paper 1 (Out of <span id="paper1KiswahiliOutOf">100</span>)</label>
                                <input type="number" class="form-control" id="paper1KiswahiliMarks" name="paper1Kiswahili" min="0">
                            </div>
                            <div class="mb-3">
                                <label for="paper2KiswahiliMarks" class="form-label">Paper 2 (Out of <span id="paper2KiswahiliOutOf">100</span>)</label>
                                <input type="number" class="form-control" id="paper2KiswahiliMarks" name="paper2Kiswahili" min="0">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Total Percentage: <span id="kiswahiliTotalPercentage">0%</span></label>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="submit" class="btn btn-primary">Save Marks</button>
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- No Data Message -->
    <div class="no-data" id="noDataMessage" style="display: none;">
        <i class="fas fa-inbox" style="font-size: 48px; color: #ccc; margin-bottom: 20px; display: block;"></i>
        <p>No students found for this subject and class.</p>
    </div>
</section>

<div id="footerContainer"></div>

<script src="../js/script.js"></script>
<script src="../js/examiner-data.js"></script>
<script src="../js/header-init.js"></script>
<script src="../js/subjects.js"></script>

</body>
</html>
